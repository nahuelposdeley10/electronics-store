map $http_upgrade $electronics_connection_upgrade {
    default upgrade;
    '' close;
}
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 137.184.155.228;
    server_tokens off;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://137.184.155.228$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 137.184.155.228;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/137.184.155.228/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/137.184.155.228/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:electronicsSSL:10m;
    client_max_body_size 12m;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $electronics_connection_upgrade;
        proxy_read_timeout 120s;
    }
}
